[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "smt-task-manager"
version = "0.1.0"
description = "SMT Task Manager — process management app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
smt-core = { path = "core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tokio = { version = "1", features = ["sync", "rt"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
