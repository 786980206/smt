[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "smt-task-manager"
version = "0.1.0"
description = "SMT Task Manager — process management app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
smt-core = { path = "core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tokio = { version = "1", features = ["sync", "rt"] }
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = "0.8"
strip-ansi-escapes = "0.2.1"
serde_yaml_ng = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

# 发布体积极限压缩：全量 LTO + 单单元 + 去符号 + 尺寸优先 + abort
# （进程管理应用对吞吐不敏感，牺牲一点运行速度换体积）
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"